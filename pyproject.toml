[project]
name = "kami"
version = "0.2.1"
description = "kami — a minimal reading ledger for manga, manhwa, manhua, web novels, comics and etc..."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["manga", "tracker", "reading", "cli", "sqlite"]
dependencies = [
    "platformdirs>=4.12.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kami"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kami",
    "README.md",
    "pyproject.toml",
]

[project.scripts]
kami = "kami.cli:main"
